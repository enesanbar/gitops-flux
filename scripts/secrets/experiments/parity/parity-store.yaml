# The reference store with exactly two changes, both forced by the cluster boundary rather than
# by the ESO version: the lab Vault reviews this cluster's tokens through a second auth mount, and
# the role is bound to this cluster's trellis/vault-auth. Everything else is the reference file.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: trellis
spec:
  provider:
    vault:
      server: https://vault.vault.svc:8200
      path: secret-lab
      version: v2
      caProvider:
        type: ConfigMap
        name: vault-ca
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes-tenant
          role: parity
          serviceAccountRef:
            name: vault-auth
            audiences:
            - vault
