# Chart 0.20.3 grants the controller serviceaccounts/token create in its ClusterRole, cluster-wide
# and unconditionally: the values switch that turns it off (rbac.serviceAccountTokenCreate) first
# exists in chart 2.5.0, where it still defaults to true. With that rule present, a per-namespace Role
# granting token create for one ServiceAccount adds nothing, and a compromised operator can mint an
# API token for any ServiceAccount in the cluster.
#
# This is the patch body a Flux HelmRelease carries under spec.postRenderers[].kustomize.patches
# (target: ClusterRole external-secrets-controller). The test op makes it fail closed: if a chart
# upgrade moves the rule, the render fails instead of silently removing a different one.
- op: test
  path: /rules/7/resources/0
  value: serviceaccounts/token
- op: remove
  path: /rules/7
