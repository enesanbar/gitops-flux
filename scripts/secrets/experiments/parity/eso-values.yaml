# Copied from components/external-secrets/helm-release.yaml so the parity cluster runs the same
# configuration as the lab, only at chart 0.20.3. serviceMonitor is dropped: the throwaway has no
# Prometheus operator, so the ServiceMonitor CRD it renders does not exist there.
replicaCount: 1
leaderElect: true
installCRDs: true
processClusterStore: false
processClusterExternalSecret: false
processPushSecret: false
processClusterPushSecret: false
processClusterGenerator: false
crds:
  annotations:
    helm.sh/resource-policy: keep
rbac:
  serviceAccountTokenCreate: false
  aggregateToView: false
  aggregateToEdit: false
  aggregateToAdmin: false
serviceAccount:
  create: true
  name: external-secrets
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
  enabled: true
  runAsUser: 1000
webhook:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
    enabled: true
    runAsUser: 1000
certController:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
    enabled: true
    runAsUser: 1000
