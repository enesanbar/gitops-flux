# The mutable half of the parity gate, applied by parity-checks.sh to each operator under test with
# __NS__ and __PREFIX__ substituted: one run per cluster, each with its own backend subtree, so the
# same checks produce comparable transcripts and never touch the reference paths, which hold the
# running lab application's key-encryption key.
# One object per feature the conventions standardize or refuse.
---
# STANDARDIZED: explicit data[] mapping, Periodic refresh, Owner, Retain.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: p-explicit, namespace: __NS__}
spec:
  refreshPolicy: Periodic
  refreshInterval: 30s
  secretStoreRef: {name: vault, kind: SecretStore}
  target: {name: p-explicit, creationPolicy: Owner, deletionPolicy: Retain}
  data:
  - secretKey: KEK
    remoteRef: {key: __PREFIX__/kek, property: KEK}
---
# STANDARDIZED for a key that shares a Secret with credentials: the entry's version is pinned, so a
# new backend version reaches nothing until a reviewed change moves the number.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: p-pinned, namespace: __NS__}
spec:
  refreshPolicy: Periodic
  refreshInterval: 30s
  secretStoreRef: {name: vault, kind: SecretStore}
  target: {name: p-pinned, creationPolicy: Owner, deletionPolicy: Retain}
  data:
  - secretKey: KEK
    remoteRef: {key: __PREFIX__/kek, property: KEK, version: "1"}
  - secretKey: SERVICE_TOKEN
    remoteRef: {key: __PREFIX__/service-token, property: SERVICE_TOKEN}
---
# STANDARDIZED: dataFrom.extract pulls every field of one entry, the shape of a credential pair.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: p-extract, namespace: __NS__}
spec:
  refreshPolicy: Periodic
  refreshInterval: 30s
  secretStoreRef: {name: vault, kind: SecretStore}
  target: {name: p-extract, creationPolicy: Owner, deletionPolicy: Retain}
  dataFrom:
  - extract: {key: __PREFIX__/composed}
---
# STANDARDIZED: template.type with engineVersion v2 produces a typed kubernetes.io/tls Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: p-typed-tls, namespace: __NS__}
spec:
  refreshPolicy: Periodic
  refreshInterval: 30s
  secretStoreRef: {name: vault, kind: SecretStore}
  target:
    name: p-typed-tls
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
      engineVersion: v2
      data:
        tls.crt: '{{ .crt }}'
        tls.key: '{{ .key }}'
  data:
  - secretKey: crt
    remoteRef: {key: __PREFIX__/tls, property: tls.crt}
  - secretKey: key
    remoteRef: {key: __PREFIX__/tls, property: tls.key}
---
# STANDARDIZED, key class in its own Secret only: CreatedOnce must NOT follow a backend rotation.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: p-createdonce, namespace: __NS__}
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef: {name: vault, kind: SecretStore}
  target: {name: p-createdonce, creationPolicy: Owner, deletionPolicy: Retain}
  data:
  - secretKey: KEK
    remoteRef: {key: __PREFIX__/kek, property: KEK}
---
# The control for p-createdonce: the same entry, Periodic, on the same one-hour interval a CreatedOnce
# object effectively has. Both are force-synced after a rotation; this one must follow and
# p-createdonce must not, or the CreatedOnce check proves nothing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: p-periodic-slow, namespace: __NS__}
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef: {name: vault, kind: SecretStore}
  target: {name: p-periodic-slow, creationPolicy: Owner, deletionPolicy: Retain}
  data:
  - secretKey: KEK
    remoteRef: {key: __PREFIX__/kek, property: KEK}
---
# REFUSED, hazard under test: deletionPolicy Delete removes the consumer's Secret when the backend
# entry disappears. Reads an entry nothing else here reads, so deleting it disturbs no other check.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: p-delete-policy, namespace: __NS__}
spec:
  refreshPolicy: Periodic
  refreshInterval: 30s
  secretStoreRef: {name: vault, kind: SecretStore}
  target: {name: p-delete-policy, creationPolicy: Owner, deletionPolicy: Delete}
  data:
  - secretKey: VALUE
    remoteRef: {key: __PREFIX__/doomed, property: VALUE}
---
# REFUSED, hazard under test: dataFrom.find keeps reporting Ready while a key removed from the
# matched set silently disappears from the Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: p-find, namespace: __NS__}
spec:
  refreshPolicy: Periodic
  refreshInterval: 30s
  secretStoreRef: {name: vault, kind: SecretStore}
  target: {name: p-find, creationPolicy: Owner, deletionPolicy: Retain}
  dataFrom:
  - find:
      path: __PREFIX__/found
      name: {regexp: '.*'}
    rewrite:
    # Whatever prefix the provider reports, a Secret key may not contain a slash.
    - regexp: {source: '/', target: '_'}
