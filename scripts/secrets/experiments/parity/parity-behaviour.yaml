# The mutable half of the parity gate. Every ExternalSecret here reads secret-lab/parity/*, a
# subtree seeded and destroyed by parity-gate.sh, because each check rotates or deletes its
# backend entry - something the reference paths cannot tolerate while the lab Trellis is running.
# One object per feature the conventions either standardize or deliberately refuse, so a single
# reconcile pass answers "does 0.20.3 behave the way 2.11.0 did".
---
# STANDARDIZED: explicit data[] mapping, Periodic refresh, Owner, Retain.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: p-explicit, namespace: trellis}
spec:
  refreshPolicy: Periodic
  refreshInterval: 30s
  secretStoreRef: {name: vault, kind: SecretStore}
  target: {name: p-explicit, creationPolicy: Owner, deletionPolicy: Retain}
  data:
  - secretKey: TRELLIS_KEK
    remoteRef: {key: parity/kek, property: TRELLIS_KEK}
---
# STANDARDIZED: dataFrom.extract pulls every field of one entry without naming them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: p-extract, namespace: trellis}
spec:
  refreshPolicy: Periodic
  refreshInterval: 30s
  secretStoreRef: {name: vault, kind: SecretStore}
  target: {name: p-extract, creationPolicy: Owner, deletionPolicy: Retain}
  dataFrom:
  - extract: {key: parity/composed}
---
# STANDARDIZED: template.type with engineVersion v2 produces a typed kubernetes.io/tls Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: p-typed-tls, namespace: trellis}
spec:
  refreshPolicy: Periodic
  refreshInterval: 30s
  secretStoreRef: {name: vault, kind: SecretStore}
  target:
    name: p-typed-tls
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
      engineVersion: v2
      data:
        tls.crt: '{{ .crt }}'
        tls.key: '{{ .key }}'
  data:
  - secretKey: crt
    remoteRef: {key: parity/tls, property: tls.crt}
  - secretKey: key
    remoteRef: {key: parity/tls, property: tls.key}
---
# STANDARDIZED, key class only: CreatedOnce must NOT follow a backend rotation.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: p-createdonce, namespace: trellis}
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef: {name: vault, kind: SecretStore}
  target: {name: p-createdonce, creationPolicy: Owner, deletionPolicy: Retain}
  data:
  - secretKey: TRELLIS_KEK
    remoteRef: {key: parity/kek, property: TRELLIS_KEK}
---
# NOT STANDARDIZED, hazard under test: deletionPolicy Delete removes the consumer's Secret when
# the backend entry disappears, turning a backend blip into a missing mount.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: p-delete-policy, namespace: trellis}
spec:
  refreshPolicy: Periodic
  refreshInterval: 30s
  secretStoreRef: {name: vault, kind: SecretStore}
  target: {name: p-delete-policy, creationPolicy: Owner, deletionPolicy: Delete}
  data:
  - secretKey: TRELLIS_SERVICE_TOKEN
    remoteRef: {key: parity/service-token, property: TRELLIS_SERVICE_TOKEN}
---
# NOT STANDARDIZED, hazard under test: dataFrom.find keeps reporting Ready while a key that has
# been removed from the matched set silently disappears from the Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: p-find, namespace: trellis}
spec:
  refreshPolicy: Periodic
  refreshInterval: 30s
  secretStoreRef: {name: vault, kind: SecretStore}
  target: {name: p-find, creationPolicy: Owner, deletionPolicy: Retain}
  dataFrom:
  - find:
      path: parity/
      name: {regexp: '.*'}
    rewrite:
    # Whatever prefix the provider reports, a Secret key may not contain a slash.
    - regexp: {source: '/', target: '_'}
