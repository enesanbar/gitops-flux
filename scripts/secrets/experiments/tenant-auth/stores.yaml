apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-k8s
  namespace: default
spec:
  provider:
    vault:
      server: https://vault.kindcluster.dev
      path: secret-lab
      version: v2
      caProvider: {type: ConfigMap, name: vault-ca, key: ca.crt}
      auth:
        kubernetes:
          mountPath: kubernetes-tenant
          role: tenant-probe
          serviceAccountRef: {name: vault-auth, audiences: [vault]}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-jwt
  namespace: default
spec:
  provider:
    vault:
      server: https://vault.kindcluster.dev
      path: secret-lab
      version: v2
      caProvider: {type: ConfigMap, name: vault-ca, key: ca.crt}
      auth:
        jwt:
          path: jwt-tenant
          role: tenant-probe
          kubernetesServiceAccountToken:
            serviceAccountRef: {name: vault-auth}
            audiences: [vault]
            expirationSeconds: 600
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-jwt-static
  namespace: default
spec:
  provider:
    vault:
      server: https://vault.kindcluster.dev
      path: secret-lab
      version: v2
      caProvider: {type: ConfigMap, name: vault-ca, key: ca.crt}
      auth:
        jwt:
          path: jwt-tenant-static
          role: tenant-probe
          kubernetesServiceAccountToken:
            serviceAccountRef: {name: vault-auth}
            audiences: [vault]
            expirationSeconds: 600
