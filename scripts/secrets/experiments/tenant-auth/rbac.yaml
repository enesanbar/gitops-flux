apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: default
automountServiceAccountToken: false
---
# ESO mints vault-auth tokens through the TokenRequest API.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-vault-token
  namespace: default
rules:
- apiGroups: ['']
  resources: [serviceaccounts/token]
  resourceNames: [vault-auth]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-vault-token
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-vault-token
subjects:
- kind: ServiceAccount
  name: external-secrets
  namespace: external-secrets
---
# Kubernetes-auth variant: Vault reviews the client JWT with the TokenReview API using that same
# JWT, so the client identity must be allowed to call TokenReview.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-auth-token-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
- kind: ServiceAccount
  name: vault-auth
  namespace: default
---
# JWT variant with jwks_url: Vault fetches the JWKS anonymously, so discovery must be open.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: anonymous-issuer-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:service-account-issuer-discovery
subjects:
- kind: Group
  name: system:unauthenticated
  apiGroup: rbac.authorization.k8s.io
