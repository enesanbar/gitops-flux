---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: probe-k8s
  namespace: default
spec:
  refreshPolicy: Periodic
  refreshInterval: 30s
  secretStoreRef: {name: vault-k8s, kind: SecretStore}
  target: {name: probe-k8s, creationPolicy: Owner, deletionPolicy: Delete}
  data:
  - secretKey: TRELLIS_LLM_API_KEY
    remoteRef: {key: trellis/llm, property: TRELLIS_LLM_API_KEY}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: probe-jwt
  namespace: default
spec:
  refreshPolicy: Periodic
  refreshInterval: 30s
  secretStoreRef: {name: vault-jwt, kind: SecretStore}
  target: {name: probe-jwt, creationPolicy: Owner, deletionPolicy: Delete}
  data:
  - secretKey: TRELLIS_LLM_API_KEY
    remoteRef: {key: trellis/llm, property: TRELLIS_LLM_API_KEY}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: probe-jwt-static
  namespace: default
spec:
  refreshPolicy: Periodic
  refreshInterval: 30s
  secretStoreRef: {name: vault-jwt-static, kind: SecretStore}
  target: {name: probe-jwt-static, creationPolicy: Owner, deletionPolicy: Delete}
  data:
  - secretKey: TRELLIS_LLM_API_KEY
    remoteRef: {key: trellis/llm, property: TRELLIS_LLM_API_KEY}
