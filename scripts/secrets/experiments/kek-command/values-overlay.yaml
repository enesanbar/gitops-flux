api:
  extraEnvs:
    - name: TRELLIS_LLM_REASONING_EFFORT
      value: none
    - name: TRELLIS_KEK_COMMAND
      value: NODE_EXTRA_CA_CERTS=/etc/trellis/vault-ca/ca.crt node /etc/trellis/kek-fetch/fetch.mjs
  extraVolumes:
    - name: gitremote
      persistentVolumeClaim:
        claimName: trellis-gitremote
    - name: vault-token
      projected:
        sources:
          - serviceAccountToken:
              audience: vault
              expirationSeconds: 600
              path: token
    - name: vault-ca
      configMap:
        name: vault-ca
    - name: kek-fetch
      configMap:
        name: trellis-kek-fetch
        defaultMode: 292
  extraVolumeMounts:
    - mountPath: /remotes
      name: gitremote
    - name: vault-token
      mountPath: /var/run/secrets/vault
      readOnly: true
    - name: vault-ca
      mountPath: /etc/trellis/vault-ca
      readOnly: true
    - name: kek-fetch
      mountPath: /etc/trellis/kek-fetch
      readOnly: true
worker:
  extraEnvs:
    - name: TRELLIS_LOG_LEVEL
      value: info
    - name: TRELLIS_KEK_COMMAND
      value: NODE_EXTRA_CA_CERTS=/etc/trellis/vault-ca/ca.crt node /etc/trellis/kek-fetch/fetch.mjs
  extraVolumes:
    - name: gitremote
      persistentVolumeClaim:
        claimName: trellis-gitremote
    - name: vault-token
      projected:
        sources:
          - serviceAccountToken:
              audience: vault
              expirationSeconds: 600
              path: token
    - name: vault-ca
      configMap:
        name: vault-ca
    - name: kek-fetch
      configMap:
        name: trellis-kek-fetch
        defaultMode: 292
  extraVolumeMounts:
    - mountPath: /remotes
      name: gitremote
    - name: vault-token
      mountPath: /var/run/secrets/vault
      readOnly: true
    - name: vault-ca
      mountPath: /etc/trellis/vault-ca
      readOnly: true
    - name: kek-fetch
      mountPath: /etc/trellis/kek-fetch
      readOnly: true
