apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault-secrets-operator
  namespace: vault-secrets-operator
spec:
  interval: 1h
  timeout: 10m
  releaseName: vault-secrets-operator
  chart:
    spec:
      chart: vault-secrets-operator
      version: 1.5.1
      sourceRef:
        kind: HelmRepository
        name: hashicorp
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    controller:
      replicas: 1
      manager:
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        clientCache:
          persistenceModel: none
      kubeRbacProxy:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      podSecurityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    defaultVaultConnection:
      enabled: false
    defaultAuthMethod:
      enabled: false
    telemetry:
      serviceMonitor:
        enabled: true
        selectors:
          release: kube-prometheus-stack
    hooks:
      upgradeCRDs:
        enabled: false
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: Deployment
          name: vault-secrets-operator-controller-manager
        patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: vault-secrets-operator-controller-manager
          spec:
            template:
              spec:
                volumes:
                - name: metrics-tls
                  secret:
                    secretName: vso-metrics-tls
                containers:
                - name: kube-rbac-proxy
                  args:
                  - --secure-listen-address=0.0.0.0:8443
                  - --upstream=http://127.0.0.1:8080/
                  - --logtostderr=true
                  - --v=0
                  - --tls-cert-file=/metrics-tls/tls.crt
                  - --tls-private-key-file=/metrics-tls/tls.key
                  volumeMounts:
                  - name: metrics-tls
                    mountPath: /metrics-tls
                    readOnly: true
      - target:
          kind: ServiceMonitor
        patch: |
          - op: replace
            path: /spec/endpoints/0/tlsConfig
            value:
              serverName: vault-secrets-operator-metrics-service.vault-secrets-operator.svc
              ca:
                secret:
                  name: vso-metrics-tls
                  key: ca.crt
