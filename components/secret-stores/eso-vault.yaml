apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: secret-lab-eso
spec:
  provider:
    vault:
      server: https://vault.vault.svc:8200
      path: secret-lab
      version: v2
      caProvider:
        type: ConfigMap
        name: vault-ca
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef:
            name: vault-auth
            audiences:
            - vault
