---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: keycloak-postgres-data
spec:
  storageClassName: standard
  persistentVolumeReclaimPolicy: Retain
  # Pin the volume to whichever node carries the pool; the scheduler then places
  # the pod there without a nodeSelector on the workload.
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: gitops-flux.local/data-pool-1
              operator: In
              values: ["true"]
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 10Gi
  hostPath:
    path: /mnt/data-pool-1/keycloak-postgres-data
  claimRef:
    namespace: keycloak
    name: keycloak-postgres-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-postgres-data
  namespace: keycloak
spec:
  volumeMode: Filesystem
  volumeName: keycloak-postgres-data
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
