apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: vault
spec:
  interval: 1h
  timeout: 10m
  releaseName: vault
  chart:
    spec:
      chart: vault
      version: 0.34.1
      sourceRef:
        kind: HelmRepository
        name: hashicorp
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
    disableWait: true
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
    disableWait: true
  values:
    global:
      tlsDisable: false
    injector:
      enabled: false
    csi:
      enabled: false
    server:
      image:
        repository: hashicorp/vault
        tag: 2.0.4
      dev:
        enabled: false
      standalone:
        enabled: false
      ha:
        enabled: true
        replicas: 1
        raft:
          enabled: true
          setNodeId: true
          config: |
            ui = true
            disable_mlock = true
            listener "tcp" {
              address = "[::]:8200"
              cluster_address = "[::]:8201"
              tls_cert_file = "/vault/tls/tls.crt"
              tls_key_file = "/vault/tls/tls.key"
              tls_min_version = "tls12"
              telemetry {
                unauthenticated_metrics_access = true
              }
            }
            storage "raft" {
              path = "/vault/data"
            }
            service_registration "kubernetes" {}
            telemetry {
              prometheus_retention_time = "60s"
              disable_hostname = true
            }
      dataStorage:
        enabled: true
        size: 5Gi
        storageClass: standard
      persistentVolumeClaimRetentionPolicy:
        whenDeleted: Retain
        whenScaled: Retain
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi
      statefulSet:
        securityContext:
          pod:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          container:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
              - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 16Mi
      - name: tls
        secret:
          secretName: vault-server-tls
      volumeMounts:
      - name: tmp
        mountPath: /tmp
      - name: tls
        mountPath: /vault/tls
        readOnly: true
      extraEnvironmentVars:
        VAULT_CACERT: /vault/tls/ca.crt
        VAULT_TLS_SERVER_NAME: vault.vault.svc
      readinessProbe:
        enabled: true
        path: /v1/sys/health?standbyok=true
      # Off, as upstream ships it: a restart always seals Vault, so liveness can
      # only turn a stall (every laptop sleep) into a manual unseal.
      livenessProbe:
        enabled: false
      ingress:
        enabled: true
        ingressClassName: nginx
        activeService: true
        annotations:
          nginx.ingress.kubernetes.io/backend-protocol: HTTPS
          nginx.ingress.kubernetes.io/proxy-ssl-verify: 'on'
          nginx.ingress.kubernetes.io/proxy-ssl-secret: vault/vault-server-tls
          nginx.ingress.kubernetes.io/proxy-ssl-name: vault.vault.svc
          nginx.ingress.kubernetes.io/proxy-ssl-server-name: 'on'
        hosts:
        - host: vault.kindcluster.dev
          paths: []
        tls:
        - secretName: vault-server-tls
          hosts:
          - vault.kindcluster.dev
    ui:
      enabled: true
    serverTelemetry:
      serviceMonitor:
        enabled: true
        selectors:
          release: kube-prometheus-stack
        tlsConfig:
          serverName: vault.vault.svc
          ca:
            secret:
              name: vault-server-tls
              key: ca.crt
