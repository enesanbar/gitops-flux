apiVersion: beat.k8s.elastic.co/v1beta1
kind: Beat
metadata:
  name: filebeat
  namespace: monitoring
spec:
  type: filebeat
  version: 9.5.3
  # No elasticsearchRef on purpose: output goes to Logstash, which owns the ES credentials.
  config:
    filebeat.inputs:
      - type: filestream
        id: kubernetes-containers
        paths:
          - /var/log/containers/*.log
        parsers:
          - container: {}
        # Fingerprint identity survives kubelet log rotation and the inode reuse it causes; the plain
        # inode identity re-ships or drops lines when that happens.
        prospector.scanner:
          fingerprint.enabled: true
          symlinks: true
        file_identity.fingerprint: {}
    processors:
      - add_kubernetes_metadata:
          host: "${NODE_NAME}"
          matchers:
            - logs_path:
                logs_path: /var/log/containers/
    output.logstash:
      hosts:
        - logstash-ls-beats.monitoring.svc.cluster.local:5044
  daemonSet:
    podTemplate:
      spec:
        # add_kubernetes_metadata lists pods/nodes/namespaces through the API; ECK creates no RBAC for
        # that, so rbac.yaml provides this account.
        serviceAccountName: filebeat
        automountServiceAccountToken: true
        terminationGracePeriodSeconds: 30
        containers:
          - name: filebeat
            securityContext:
              runAsUser: 0 # container log files on the node are root-owned
            env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 256Mi
            volumeMounts:
              - name: varlogcontainers
                mountPath: /var/log/containers
                readOnly: true
              - name: varlogpods
                mountPath: /var/log/pods
                readOnly: true
        # kind runs containerd: /var/log/containers/*.log symlinks resolve into /var/log/pods, so the
        # /var/lib/docker/containers mount from the upstream recipe has nothing to offer here.
        # ECK adds the per-node hostPath for the registry (filebeat data dir) itself.
        volumes:
          - name: varlogcontainers
            hostPath:
              path: /var/log/containers
          - name: varlogpods
            hostPath:
              path: /var/log/pods
