# Built-in index templates default to 1 replica, which a single node can never assign, so health sits at
# yellow. The built-in logs-*-* template (Logstash's data stream output) composes an optional logs@custom
# hook for this. ES has no config-file home for templates and ECK's StackConfigPolicy needs an Enterprise
# license, so this Job owns logs@custom outright: edits made in Kibana are overwritten on the next run.
# The elasticsearch Flux Kustomization waits on it, so Logstash (dependsOn elasticsearch) cannot create
# its data stream before the template exists, even on an empty data PV.
apiVersion: batch/v1
kind: Job
metadata:
  name: elasticsearch-index-defaults
  namespace: monitoring
  annotations:
    # Job specs are immutable; lets Flux recreate (and so re-run) it when this file changes.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  # No ttlSecondsAfterFinished: Flux would recreate the deleted Job every reconcile interval.
  # No activeDeadlineSeconds: a Failed Job is never recreated while its spec is unchanged, so one slow
  # bootstrap would block Kibana and Logstash for good. The wait loop below is the retry instead.
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: apply
          # Same image as the ES pod: already on the node, pinned to the stack version, ships curl.
          image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
          command: [/bin/bash, -ec]
          args:
            - |
              es=http://elasticsearch-es-http.monitoring.svc:9200
              until curl -sf -u "elastic:${ELASTIC_PASSWORD}" "${es}/_cluster/health?wait_for_status=yellow&timeout=10s" >/dev/null; do
                echo "waiting for elasticsearch"; sleep 5
              done
              # auto_expand_replicas rather than number_of_replicas: 0, so a second data node gets a replica.
              curl -sS --fail-with-body -u "elastic:${ELASTIC_PASSWORD}" -X PUT "${es}/_component_template/logs@custom" \
                -H 'Content-Type: application/json' \
                -d '{"template":{"settings":{"index":{"auto_expand_replicas":"0-1"}}},"_meta":{"managed_by":"gitops-flux components/monitoring/elasticsearch/index-defaults-job.yaml"}}'
              echo
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-es-elastic-user # generated by ECK
                  key: elastic
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
