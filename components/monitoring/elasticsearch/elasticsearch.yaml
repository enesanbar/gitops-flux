apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch
  namespace: monitoring
spec:
  version: 9.5.3
  http:
    tls:
      selfSignedCertificate:
        # mkcert terminates TLS at the ingress. Keeping the in-cluster hop on plain HTTP means Logstash,
        # Kibana and any future otel exporter talk to elasticsearch-es-http:9200 with no CA plumbing.
        disabled: true
  nodeSets:
    - name: default
      count: 1
      config:
        # With mmap allowed, ES enforces vm.max_map_count >= 262144 at boot (1048576 recommended). That
        # sysctl is not namespaced: every kind node reads the Docker Desktop VM's or Linux host's kernel
        # value, and a pod can only raise it through a privileged init container. The upstream kernel
        # default is 65530 (Docker Desktop 4.25 shipped that too), so niofs keeps ES booting on any host;
        # the slower read path is noise for a single-node dev log sink.
        # https://www.elastic.co/docs/deploy-manage/deploy/cloud-on-k8s/virtual-memory
        node.store.allow_mmap: false
      podTemplate:
        spec:
          containers:
            - name: elasticsearch
              resources:
                requests:
                  cpu: 500m
                  memory: 2Gi
                limits:
                  memory: 2Gi
      volumeClaimTemplates:
        # Yields PVC elasticsearch-data-elasticsearch-es-default-0; the cluster overlay pre-binds a
        # static hostPath PV to that exact name.
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: standard
            resources:
              requests:
                storage: 30Gi
