# Restart tooling under evaluation: restarts a Deployment when a Secret or ConfigMap it mounts or
# references changes, so a rotated value reaches a process that only reads at start. Workloads opt in
# with the reloader.stakater.com/auto annotation; nothing is restarted without it.
#
# TRUST BOUNDARY, measured 2026-09-22: this controller reads EVERY Secret in the cluster (its
# ClusterRole holds secrets get/list/watch) and patches every Deployment, DaemonSet and StatefulSet.
# That is the price of the capability, and on a tenant cluster it is the reason to scope it by
# namespace rather than run it globally.
#
# reloadStrategy, and what it does NOT buy: the chart's default writes a fingerprint of the watched
# Secret's CONTENT into the pod template as a STAKATER_<NAME>_SECRET environment variable. Setting
# `annotations` MOVES that fingerprint to a `reloader.stakater.com/last-reloaded-from` pod-template
# annotation whose `hash` field is the same content digest (measured: 40 hex characters, identical
# across every Deployment consuming the Secret). It does not remove it, and it cannot: a restart
# trigger has to be able to tell that the content changed. So anyone who can read a Deployment can
# read a digest of the Secret, a KEK included, under either strategy. The annotation is the lesser
# evil because it is not handed to the process, but the exposure is the mechanism's, not the
# strategy's, and a workload whose key must not be fingerprinted at all cannot use a reloader.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: reloader
spec:
  interval: 1h
  timeout: 5m
  releaseName: reloader
  chart:
    spec:
      chart: reloader
      version: 2.2.17
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    reloader:
      reloadOnCreate: false
      reloadStrategy: annotations
      namespaceSelector: kubernetes.io/metadata.name=trellis
      deployment:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
