# Restart tooling under evaluation: restarts a Deployment when a Secret or ConfigMap it mounts or
# references changes, so a rotated value reaches a process that only reads at start. Workloads opt in
# with the reloader.stakater.com/auto annotation; nothing is restarted without it.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: reloader
spec:
  interval: 1h
  timeout: 5m
  releaseName: reloader
  chart:
    spec:
      chart: reloader
      version: 2.2.17
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    reloader:
      reloadOnCreate: false
      deployment:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
