apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  namespace: secret-lab-vso
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-consumer
  template:
    metadata:
      labels:
        app: secret-consumer
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: consumer
        image: busybox:1.37.0
        command:
        - sh
        - -ec
        - while true; do test -s /secrets/message; sleep 5; done
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            cpu: 100m
            memory: 32Mi
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - test -s /secrets/message
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - kill -0 1
          periodSeconds: 20
        volumeMounts:
        - name: secret
          mountPath: /secrets
          readOnly: true
      volumes:
      - name: secret
        secret:
          secretName: vso-example
          defaultMode: 288
