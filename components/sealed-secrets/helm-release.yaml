apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sealed-secrets
  namespace: sealed-secrets
spec:
  interval: 1h
  timeout: 10m
  releaseName: sealed-secrets-controller
  chart:
    spec:
      chart: sealed-secrets
      version: 2.20.0
      sourceRef:
        kind: HelmRepository
        name: sealed-secrets
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    fullnameOverride: sealed-secrets-controller
    keyrenewperiod: '0'
    secretName: sealed-secrets-key
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    podSecurityContext:
      enabled: true
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
      enabled: true
      runAsUser: 1001
    additionalVolumes:
    - name: key-custody
      configMap:
        name: sealed-secrets-key-custody
    additionalVolumeMounts:
    - name: key-custody
      mountPath: /key-custody
      readOnly: true
    metrics:
      serviceMonitor:
        enabled: true
        labels:
          release: kube-prometheus-stack
    skipRecreate: false
