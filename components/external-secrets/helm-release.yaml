apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 1h
  timeout: 10m
  releaseName: external-secrets
  chart:
    spec:
      chart: external-secrets
      version: 2.11.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    replicaCount: 1
    leaderElect: true
    installCRDs: true
    processClusterStore: false
    processClusterExternalSecret: false
    processPushSecret: false
    processClusterPushSecret: false
    processClusterGenerator: false
    crds:
      annotations:
        helm.sh/resource-policy: keep
    rbac:
      serviceAccountTokenCreate: false
      aggregateToView: false
      aggregateToEdit: false
      aggregateToAdmin: false
    serviceAccount:
      create: true
      name: external-secrets
    resources: &id001
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities: &id002
        drop:
        - ALL
      seccompProfile: &id003
        type: RuntimeDefault
      enabled: true
      runAsUser: 1000
    serviceMonitor:
      enabled: true
      renderMode: alwaysRender
      additionalLabels:
        release: kube-prometheus-stack
    webhook:
      resources: *id001
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities: *id002
        seccompProfile: *id003
        enabled: true
        runAsUser: 1000
    certController:
      resources: *id001
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities: *id002
        seccompProfile: *id003
        enabled: true
        runAsUser: 1000
