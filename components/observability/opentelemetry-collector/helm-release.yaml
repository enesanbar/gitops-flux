apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-collector
  namespace: observability
spec:
  interval: 1h
  releaseName: otel-collector
  chart:
    spec:
      chart: opentelemetry-collector
      version: "0.172.0"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    mode: deployment
    replicaCount: 1
    image:
      # Docker Hub pushes stopped at collector v0.123.1; ghcr.io is the only source now.
      repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
    command:
      name: otelcol-contrib
    presets:
      kubernetesAttributes:
        enabled: true
    ports:
      otlp:
        enabled: true
        containerPort: 4317
        servicePort: 4317
        protocol: TCP
      otlp-http:
        enabled: true
        containerPort: 4318
        servicePort: 4318
        protocol: TCP
      metrics:
        enabled: true
        containerPort: 8888
        servicePort: 8888
        protocol: TCP
    config:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
              cors:
                allowed_origins:
                  - "https://*.kindcluster.dev"
      processors:
        memory_limiter:
          check_interval: 1s
          limit_percentage: 80
          spike_limit_percentage: 25
        batch: {}
        # Drop the chart preset's `connection` fallback in pod_association.
        # External traffic arriving via ingress-nginx would otherwise be
        # mis-attributed to the ingress controller pod (peer IP). Only enrich
        # when the source explicitly sets k8s.pod.ip or k8s.pod.uid as
        # resource attributes — in-cluster OTel SDKs with the Kubernetes
        # resource detector do; external clients like Claude Code do not.
        k8s_attributes:
          pod_association:
            - sources:
                - from: resource_attribute
                  name: k8s.pod.ip
            - sources:
                - from: resource_attribute
                  name: k8s.pod.uid
        # Prometheus's OTLP receiver silently drops delta-temporality sums.
        # Claude Code emits claude_code.* metrics as Delta — convert here so
        # they land regardless of what the SDK is configured to send.
        # State is in-memory; the first delta after collector restart is lost.
        deltatocumulative:
          max_stale: 5m
          max_streams: 10000
        # Promote session.id from per-span/per-log-record attribute up to
        # the OTLP Resource. Two reasons:
        #   1. Loki only accepts `action: index_label` under resource
        #      attributes — Claude Code emits session.id as a record-level
        #      attribute, so without this, the value lives only as
        #      structured metadata and can't be matched in `{...}`.
        #   2. Grafana's tracesToLogsV2 button generates a Loki
        #      stream-selector query, which only works on indexed labels.
        # The processor re-groups records by session.id, creating a new
        # resource per (service.name, session.id) pair. Cardinality cost
        # is bounded: one resource per Claude Code session.
        groupbyattrs/session:
          keys:
            - session.id
      exporters:
        otlp_grpc/tempo:
          endpoint: tempo.observability.svc.cluster.local:4317
          tls:
            insecure: true
          sending_queue:
            enabled: true
            queue_size: 1000
          retry_on_failure:
            enabled: true
            initial_interval: 5s
            max_interval: 30s
            max_elapsed_time: 5m
        otlp_grpc/jaeger:
          endpoint: jaeger.observability.svc.cluster.local:4317
          tls:
            insecure: true
          sending_queue:
            enabled: true
            queue_size: 1000
          retry_on_failure:
            enabled: true
            max_elapsed_time: 5m
        # NOT WIRED INTO PIPELINES while signoz is disabled in the Flux registry:
        # exporting to a Service that no longer exists only fills the logs with
        # "Exporting failed". Re-add it to the traces and logs exporters when
        # signoz.yaml is re-enabled.
        otlp_grpc/signoz:
          endpoint: signoz-otel-collector.signoz.svc.cluster.local:4317
          tls:
            insecure: true
          sending_queue:
            enabled: true
            queue_size: 1000
          retry_on_failure:
            enabled: true
            max_elapsed_time: 5m
        otlp_http/loki:
          endpoint: http://loki.observability.svc.cluster.local:3100/otlp
          sending_queue:
            enabled: true
            queue_size: 1000
          retry_on_failure:
            enabled: true
            max_elapsed_time: 5m
        # ELK fan-out target — KEPT FOR REFERENCE, NOT WIRED INTO PIPELINE.
        # Elasticsearch is an ECK cluster in `monitoring` (plain HTTP in-cluster,
        # TLS only at the ingress). Its `elastic` superuser password lives in
        # secret elasticsearch-es-elastic-user (key `elastic`) in `monitoring`,
        # which this collector in `observability` cannot read, so an unauthenticated
        # exporter would 401 on every batch and spam the logs.
        #
        # ELK already receives cluster logs via the `filebeat` Beat CR
        # (components/monitoring/filebeat → Logstash → ES), so dropping this
        # fan-out loses no coverage — Claude Code logs still land in Loki via
        # otlp_http/loki below.
        #
        # To re-enable cleanly:
        #   1. Mirror elasticsearch-es-elastic-user into `observability` (e.g.
        #      emberstack/reflector), or create a dedicated ES user + Secret here.
        #   2. Add a basicauth/es extension referencing $ES_PASSWORD via extraEnvs.
        #   3. Set auth.authenticator: basicauth/es on this exporter.
        #   4. Re-add elasticsearch/logs to the `logs` pipeline exporters.
        # elasticsearch/logs:
        #   endpoints:
        #     - http://elasticsearch-es-http.monitoring.svc.cluster.local:9200
        #   logs_index: otel-logs
        #   auth:
        #     authenticator: basicauth/es
        #   sending_queue:
        #     enabled: true
        #     queue_size: 1000
        #   retry:
        #     enabled: true
        #     max_requests: 5
        #     initial_interval: 5s
        #     max_interval: 30s
        # Prometheus 3.x: use OTLP/HTTP exporter against the native OTLP
        # receiver (/api/v1/otlp/v1/metrics, gated by --web.enable-otlp-receiver).
        # The prometheusremotewrite exporter still reports success against
        # Prometheus 3.x but only `target_info` actually lands — histogram
        # buckets get silently dropped in the PRW1 → Prom3 translation.
        otlp_http/kps:
          metrics_endpoint: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/otlp/v1/metrics
          encoding: proto
          sending_queue:
            enabled: true
            queue_size: 10000
            num_consumers: 5
          retry_on_failure:
            enabled: true
            max_elapsed_time: 5m
        debug:
          verbosity: basic
      service:
        telemetry:
          metrics:
            readers:
              - pull:
                  exporter:
                    prometheus:
                      host: 0.0.0.0
                      port: 8888
        pipelines:
          traces:
            receivers: [otlp]
            processors: [memory_limiter, k8s_attributes, batch]
            exporters: [otlp_grpc/tempo, otlp_grpc/jaeger, debug]
          logs:
            receivers: [otlp]
            # groupbyattrs/session BEFORE batch so the resource grouping
            # is settled when the batch processor merges records of the
            # same resource into one OTLP batch.
            processors: [memory_limiter, k8s_attributes, groupbyattrs/session, batch]
            # elasticsearch/logs removed pending auth wiring — ELK still
            # ingests via filebeat. See comment on the exporter above.
            # otlp_grpc/signoz (unwired while signoz is disabled) takes logs on
            # the same port as traces when re-enabled.
            exporters: [otlp_http/loki, debug]
          metrics:
            receivers: [otlp]
            processors: [memory_limiter, deltatocumulative, batch]
            exporters: [otlp_http/kps, debug]
