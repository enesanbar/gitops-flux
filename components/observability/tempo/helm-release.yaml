apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: observability
spec:
  interval: 1h
  releaseName: tempo
  chart:
    spec:
      chart: tempo
      # grafana/tempo (1.x) is deprecated; the single-binary chart is maintained
      # at grafana-community, same values layout.
      version: "2.3.0"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    tempo:
      reportingEnabled: false
      # Blocks outlive pod restarts now that /var/tempo sits on a PV, so a
      # week of traces is meaningful and still fits comfortably in 10Gi.
      retention: 168h
      metricsGenerator:
        enabled: true
        remoteWriteUrl: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write
        processor:
          # local-blocks answers TraceQL metric queries (rate/quantile/
          # histogram_over_time) from Tempo's own memory. Left unbounded it
          # pins live traces and completed blocks in RAM indefinitely and is
          # the primary driver of Tempo's memory growth. These knobs cap it:
          # flush completed blocks to storage instead of holding them, evict
          # them from memory sooner, and hard-limit concurrent live traces.
          local_blocks:
            flush_to_storage: true
            complete_block_timeout: 15m
            max_live_traces: 5000
            trace_idle_period: 10s
        # Chart defaults are /tmp/tempo and /tmp/traces, and the chart mounts
        # /tmp as an emptyDir — off the PVC. Keep the generator's WALs next to
        # the trace data so they survive restarts too.
        storage:
          path: /var/tempo/generator/wal
        traces_storage:
          path: /var/tempo/generator/traces
      overrides:
        defaults:
          metrics_generator:
            # local-blocks is what serves TraceQL metric queries from Grafana
            # Traces Drilldown; without it they fail with "localblocks
            # processor not found". The other two feed the service graph and
            # RED metrics into Prometheus via remote_write.
            processors:
              - service-graphs
              - span-metrics
              - local-blocks
      receivers:
        # The chart's default jaeger/opencensus receivers stay on as well (Helm
        # deep-merges maps and the Service template dereferences them, so they
        # cannot be nulled). Only OTLP is actually used, via the otel-collector.
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
    persistence:
      enabled: false
    serviceMonitor:
      enabled: false
