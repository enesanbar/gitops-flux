# CloudNativePG operator. The 1.30.x line supports Kubernetes 1.34–1.36 and
# PostgreSQL 14–18; the version is pinned to what the tenant cluster is moving
# to, so a Cluster proven here is proven against the same operator. Removing
# this release removes the CRDs it templates, and every Cluster with them; the
# pool volumes keep PGDATA (Retain) and apps/trellis/pvc.yaml says how it
# comes back.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  interval: 1h
  releaseName: cloudnative-pg
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.29.0"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    crds:
      create: true
    image:
      repository: ghcr.io/cloudnative-pg/cloudnative-pg
      tag: "1.30.0"
