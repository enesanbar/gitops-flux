# The application pattern on a delivered credential. Every path begins with the cluster and this
# namespace, /devops/dev-cluster/ssm-app/..., so review and CI can hold each ExternalSecret to its
# own subtree; the one exception, the certificate, names another team's realm and is read, never
# copied into this one.
# Never pruned, for the reason trellis-secrets gives: creationPolicy Owner puts an ownerReference on
# the Secret, so a pruned or renamed ExternalSecret garbage-collects the running application's Secret.
---
# One application Secret from two parameters. The encryption key is pinned to one parameter
# version: a new version reaches nothing until a reviewed commit moves the number, which is the step
# the application's own two-key re-wrap ends with (ssm.sh refuses that write without
# --new-key-version for the same reason). The token beside it follows the latest version.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ssm-app
  namespace: ssm-app
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h  # annotate force-sync to pick up a rotated credential sooner
  secretStoreRef:
    name: aws-parameterstore
    kind: ClusterSecretStore
  target:
    name: ssm-app
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: ENCRYPTION_KEY
    remoteRef:
      key: /devops/dev-cluster/ssm-app/encryption_key
      version: "1"  # pinned; see above before changing it
  - secretKey: SERVICE_TOKEN
    remoteRef:
      key: /devops/dev-cluster/ssm-app/service_token
---
# A credential whose fields change together, kept as ONE parameter holding a JSON object and read
# with dataFrom.extract, which fetches it once: a rotation is one write and one read, so no refresh
# can pair a new username with an old password. Two remoteRef.property entries would fetch the same
# parameter twice.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ssm-app-database
  namespace: ssm-app
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameterstore
    kind: ClusterSecretStore
  target:
    name: ssm-app-database
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
  - extract:
      key: /devops/dev-cluster/ssm-app/database
---
# Free nesting below the namespace: a component, then whatever grouping its owner chooses.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ssm-app-worker
  namespace: ssm-app
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameterstore
    kind: ClusterSecretStore
  target:
    name: ssm-app-worker
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: BROKER_PASSWORD
    remoteRef:
      key: /devops/dev-cluster/ssm-app/worker/broker/password
---
# A wildcard certificate another team keeps under its own realm, as two parameters because that is
# how it keeps them, rendered as a typed Secret an Ingress accepts. Delivery only: issuing and renewing
# it stays with that team.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ssm-app-tls
  namespace: ssm-app
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h  # a certificate changes at renewal, not by the minute
  secretStoreRef:
    name: aws-parameterstore
    kind: ClusterSecretStore
  target:
    name: ssm-app-tls
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
      engineVersion: v2
      data:
        tls.crt: '{{ .crt }}'
        tls.key: '{{ .key }}'
  data:
  - secretKey: crt
    remoteRef:
      key: /dev-generic/wildcard_tls_certificate
  - secretKey: key
    remoteRef:
      key: /dev-generic/wildcard_tls_key
