# The application's three secrets composed from three parameters (a plain String for the vendor key,
# a SecureString under the default key for the token, a SecureString under a customer KMS key for the
# encryption key), once per store so the two authentication shapes compare on identical work.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trellis-secrets-static
  namespace: secret-lab-aws
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m  # experiment cadence
  secretStoreRef:
    name: aws-static
    kind: SecretStore
  target:
    name: trellis-secrets-static
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: TRELLIS_KEK
    remoteRef:
      key: /lab-island00/trellis/kek
  - secretKey: TRELLIS_SERVICE_TOKEN
    remoteRef:
      key: /lab-island00/trellis/service-token
  - secretKey: TRELLIS_LLM_API_KEY
    remoteRef:
      key: /lab-island00/trellis/llm
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trellis-secrets-vault-minted
  namespace: secret-lab-aws
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m  # experiment cadence
  secretStoreRef:
    name: aws-vault-minted
    kind: SecretStore
  target:
    name: trellis-secrets-vault-minted
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: TRELLIS_KEK
    remoteRef:
      key: /lab-island00/trellis/kek
  - secretKey: TRELLIS_SERVICE_TOKEN
    remoteRef:
      key: /lab-island00/trellis/service-token
  - secretKey: TRELLIS_LLM_API_KEY
    remoteRef:
      key: /lab-island00/trellis/llm
---
# Single-parameter mapping.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-key-only
  namespace: secret-lab-aws
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    name: aws-static
    kind: SecretStore
  target:
    name: llm-key-only
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: TRELLIS_LLM_API_KEY
    remoteRef:
      key: /lab-island00/trellis/llm
---
# Everything under a path prefix, keys named after the parameter leaf (needs GetParametersByPath).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trellis-by-path
  namespace: secret-lab-aws
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    name: aws-static
    kind: SecretStore
  target:
    name: trellis-by-path
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
  - find:
      path: /lab-island00/trellis/
      name:
        regexp: .*
    rewrite:
    - regexp:
        source: '.*/([^/]+)$'
        target: '$1'
---
# The certificate pair as two parameters, the way an estate keeps a wildcard in Parameter Store,
# rendered into a typed Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wildcard-from-ssm
  namespace: secret-lab-aws
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    name: aws-static
    kind: SecretStore
  target:
    name: wildcard-from-ssm
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
      engineVersion: v2
      data:
        tls.crt: '{{ .crt }}'
        tls.key: '{{ .key }}'
  data:
  - secretKey: crt
    remoteRef:
      key: /lab-island00/tls/wildcard_certificate
  - secretKey: key
    remoteRef:
      key: /lab-island00/tls/wildcard_key
