# ISSUANCE through cert-manager: the Certificate is renewed by cert-manager on its own schedule and
# the Secret is cert-manager's. The ClusterIssuer "vault-lab" carries this machine's public Vault CA
# and is applied by scripts/secrets/experiments/pki/cert-manager-vault-issuer.sh, not by Flux.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cm-leaf
  namespace: secret-lab-pki
spec:
  secretName: cm-leaf-tls
  dnsNames:
  - cm-leaf.kindcluster.dev
  duration: 1h      # cert-manager's minimum
  renewBefore: 20m
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: vault-lab
    kind: ClusterIssuer
