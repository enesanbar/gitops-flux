# ISSUANCE through ESO: the generator asks Vault PKI for a NEW leaf certificate on every refresh,
# so refreshInterval is the renewal cadence and must stay well below the certificate's ttl. A 72h
# leaf re-issued daily keeps the pattern observable while leaving two days of margin, at the Vault
# role's max_ttl; every issuance also grows the mount's CRL, which is why the cadence is not hourly.
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: lab-leaf
  namespace: secret-lab-pki
spec:
  path: pki-lab/issue/lab
  method: POST
  parameters:
    common_name: leaf.kindcluster.dev
    ttl: 72h
  resultType: Data
  provider:
    server: https://vault.vault.svc:8200
    caProvider:
      type: ConfigMap
      name: vault-ca
      key: ca.crt
      namespace: secret-lab-pki
    auth:
      kubernetes:
        mountPath: kubernetes
        role: pki-eso
        serviceAccountRef:
          name: vault-auth
          audiences:
          - vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: issued-leaf
  namespace: secret-lab-pki
spec:
  refreshPolicy: Periodic
  refreshInterval: 24h
  target:
    name: issued-leaf
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
      engineVersion: v2
      data:
        tls.crt: |
          {{ .certificate }}
          {{ .issuing_ca }}
        tls.key: '{{ .private_key }}'
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: VaultDynamicSecret
        name: lab-leaf
