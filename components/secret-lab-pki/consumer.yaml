# A consumer that mounts each certificate Secret as a DIRECTORY (no subPath), so the kubelet can
# refresh the files in place; the experiment reads the files' fingerprints, never their contents.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  namespace: secret-lab-pki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: consumer
        image: quay.io/prometheus/busybox:latest
        command: ['sh', '-c', 'while true; do sleep 3600; done']
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: wildcard
          mountPath: /tls/wildcard
          readOnly: true
        - name: leaf
          mountPath: /tls/leaf
          readOnly: true
        - name: cm-leaf
          mountPath: /tls/cm-leaf
          readOnly: true
      volumes:
      - name: wildcard
        secret:
          secretName: wildcard-copy-a
      - name: leaf
        secret:
          secretName: issued-leaf
      - name: cm-leaf
        secret:
          secretName: cm-leaf-tls
          optional: true
