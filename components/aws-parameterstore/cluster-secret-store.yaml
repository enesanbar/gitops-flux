# The one store of a tenant cluster. The platform hands the cluster a single AWS credential as
# external-secrets/aws-credentials, which this repository never holds (the lab writes it with
# scripts/secrets/aws-credentials.sh tenant a|b), so one cluster-scoped store reads it for every
# application. A delivered credential is usually broader than any one namespace needs: the list
# below decides which namespaces may use the store at all, and which paths each ExternalSecret may
# read is a rule for review and CI (CONVENTIONS.md §2), not something the backend enforces.
# Ready means the credential Secret was there with both keys when the store last validated (every
# five minutes by default), not that AWS accepts it: for a static key the validation makes no AWS
# call.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-parameterstore
  annotations:
    # Every ExternalSecret on the cluster stops refreshing with it gone, so no refactor prunes it.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  conditions:
  - namespaces:
    - ssm-app
  provider:
    aws:
      service: ParameterStore
      region: us-west-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials
            namespace: external-secrets
            key: aws_access_key_id
          secretAccessKeySecretRef:
            name: aws-credentials
            namespace: external-secrets
            key: aws_secret_access_key
