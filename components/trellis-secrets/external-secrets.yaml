# The application Secret the Trellis chart consumes (secrets.existingSecret): four keys composed
# from four Vault paths, one per secret class, so each can be owned, rotated and audited on its own
# while the chart still sees one Secret.
# The chart takes the key-encryption key in this same Secret, so the key cannot have the Secret of
# its own that a CreatedOnce guard needs. Its entry is pinned to one backend version instead: a new
# version written to trellis/kek reaches nothing until a reviewed commit moves the number, which is
# the step the two-key re-wrap ends with. Unpinned, a new version would reach the Secret within the
# refresh interval, the reloader would restart every consumer, and the processes would come up
# under a key that opens none of the rows sealed with the old one. Two things the pin does not do:
# a destroyed or pruned version 1 (KV v2 keeps ten versions by default) fails this whole
# ExternalSecret, so every credential beside the key stops refreshing; and anything reading the
# entry directly, rather than through this operator, still gets the latest version.
# Never pruned: creationPolicy Owner puts an ownerReference on the Secret, so a pruned or
# renamed ExternalSecret garbage-collects the running application's Secret (deletionPolicy Retain
# only covers a vanished backend entry). Same rule the trellis Kustomization applies to its KEK Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trellis-secrets
  namespace: trellis
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h  # annotate force-sync to pick up a rotated credential sooner
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: trellis-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: TRELLIS_KEK
    remoteRef:
      key: trellis/kek
      property: TRELLIS_KEK
      version: "1"  # pinned; see above before changing it
  - secretKey: TRELLIS_SERVICE_TOKEN
    remoteRef:
      key: trellis/service-token
      property: TRELLIS_SERVICE_TOKEN
  - secretKey: TRELLIS_LLM_API_KEY
    remoteRef:
      key: trellis/llm
      property: TRELLIS_LLM_API_KEY
  - secretKey: TRELLIS_EMBEDDING_API_KEY
    remoteRef:
      key: trellis/embedding
      property: TRELLIS_EMBEDDING_API_KEY
---
# The Ingress certificate as a typed kubernetes.io/tls Secret, templated from a KV entry
# that holds the PEM pair. Delivery only: issuance and renewal happen outside the cluster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trellis-tls-eso
  namespace: trellis
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h  # a certificate changes at renewal, not by the minute
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: trellis-tls-eso
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
      engineVersion: v2
      data:
        tls.crt: '{{ .crt }}'
        tls.key: '{{ .key }}'
  data:
  - secretKey: crt
    remoteRef:
      key: trellis/tls
      property: tls.crt
  - secretKey: key
    remoteRef:
      key: trellis/tls
      property: tls.key
