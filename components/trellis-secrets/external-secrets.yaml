# The application Secret the Trellis chart consumes (secrets.existingSecret): three keys
# composed from three Vault paths, one per secret class, so each can be owned, rotated and
# audited on its own while the chart still sees one Secret.
# Never pruned: creationPolicy Owner puts an ownerReference on the Secret, so a pruned or
# renamed ExternalSecret garbage-collects the running application's Secret (deletionPolicy Retain
# only covers a vanished backend entry). Same rule the trellis Kustomization applies to its KEK Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trellis-secrets
  namespace: trellis
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m  # experiment cadence for the rotation measurements; an hour is the production shape
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: trellis-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: TRELLIS_KEK
    remoteRef:
      key: trellis/kek
      property: TRELLIS_KEK
  - secretKey: TRELLIS_SERVICE_TOKEN
    remoteRef:
      key: trellis/service-token
      property: TRELLIS_SERVICE_TOKEN
  - secretKey: TRELLIS_LLM_API_KEY
    remoteRef:
      key: trellis/llm
      property: TRELLIS_LLM_API_KEY
  - secretKey: TRELLIS_EMBEDDING_API_KEY
    remoteRef:
      key: trellis/embedding
      property: TRELLIS_EMBEDDING_API_KEY
  - secretKey: TRELLIS_EMBEDDING_API_KEY
    remoteRef:
      key: trellis/embedding
      property: TRELLIS_EMBEDDING_API_KEY
---
# The Ingress certificate as a typed kubernetes.io/tls Secret, templated from a KV entry
# that holds the PEM pair. Delivery only: issuance and renewal happen outside the cluster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trellis-tls-eso
  namespace: trellis
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h  # a certificate changes at renewal, not by the minute
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: trellis-tls-eso
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
      engineVersion: v2
      data:
        tls.crt: '{{ .crt }}'
        tls.key: '{{ .key }}'
  data:
  - secretKey: crt
    remoteRef:
      key: trellis/tls
      property: tls.crt
  - secretKey: key
    remoteRef:
      key: trellis/tls
      property: tls.key
