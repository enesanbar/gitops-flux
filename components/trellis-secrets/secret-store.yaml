# Namespace-scoped store: the Vault role "trellis" is bound to this namespace's vault-auth
# ServiceAccount and to a policy that reads only the trellis/ subtree of the KV mount.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: trellis
spec:
  provider:
    vault:
      server: https://vault.vault.svc:8200
      path: secret-lab
      version: v2
      caProvider:
        type: ConfigMap
        name: vault-ca
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: trellis
          serviceAccountRef:
            name: vault-auth
            audiences:
            - vault
