apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis
  namespace: redis
spec:
  values:
    global:
      redis:
        password: password
    # The chart's "nano" preset caps each pod at 150m CPU. Under that cap the 2s readiness probe was
    # seen timing out, and the replicas restarted hundreds of times a day through their liveness probe,
    # a bash script that pings the local server and the master. Median use is ~25m per pod; the cap is
    # what the probes need headroom for.
    master:
      resources:
        requests: {cpu: 25m, memory: 64Mi}
        limits: {cpu: 500m, memory: 192Mi}
    replica:
      resources:
        requests: {cpu: 25m, memory: 64Mi}
        limits: {cpu: 500m, memory: 192Mi}
      replicaCount: 1
