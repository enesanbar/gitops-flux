---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: n8n
spec:
  storageClassName: standard
  persistentVolumeReclaimPolicy: Retain
  # Pin the volume to whichever node carries the pool; the scheduler then places
  # the pod there without a nodeSelector on the workload.
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: gitops-flux.local/data-pool-1
              operator: In
              values: ["true"]
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 10Gi
  hostPath:
    path: /mnt/data-pool-1/n8n
  claimRef:
    namespace: n8n
    name: n8n
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n
  namespace: n8n
spec:
  volumeMode: Filesystem
  volumeName: n8n
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
