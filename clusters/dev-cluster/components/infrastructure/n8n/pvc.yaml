---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: n8n
spec:
  storageClassName: standard
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 10Gi
  hostPath:
    path: /mnt/data-pool-1/n8n
  claimRef:
    namespace: n8n
    name: n8n
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n
  namespace: n8n
spec:
  volumeMode: Filesystem
  volumeName: n8n
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
