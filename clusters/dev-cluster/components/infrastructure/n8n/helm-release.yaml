apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
  namespace: n8n
spec:
  values:
    queueMode:
      enabled: false

    ingress:
      enabled: true
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: mkcert-issuer
      sticky:
        enabled: false
        cookieName: n8n_affinity
        cookieExpires: "172800"  # 2 days in seconds
        cookieMaxAge: "172800"   # 2 days in seconds
      hosts:
        - host: n8n.kindcluster.dev
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - n8n.kindcluster.dev
          secretName: n8n-tls

    # ----- Persistence -----
    persistence:
      enabled: true
      existingClaim: "n8n"
      accessModes: [ "ReadWriteOnce" ]
      size: 10Gi
      storageClassName: ""

    # ----- Secrets -----
    # N8N_ENCRYPTION_KEY (+ N8N_HOST/PORT/PROTOCOL, the chart reads all four from
    # one Secret) is per-machine key material and lives outside git. Created by
    # scripts/flux/install-n8n-secrets.sh, which keeps the key next to the pool
    # data it encrypts so a cluster reinit never produces a key/data mismatch.
    secretRefs:
      existingSecret: n8n-secrets

    # ----- Database (PostgreSQL - required for queue mode) -----
    database:
      type: sqlite
      useExternal: false

    redis:
      enabled: false
