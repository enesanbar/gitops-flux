apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vault
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 30s
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/dev-cluster/components/infrastructure/vault
  prune: true
  wait: false
  dependsOn:
  - name: cert-issuer
  - name: kube-prometheus-stack
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: vault
    namespace: vault
  - apiVersion: apps/v1
    kind: StatefulSet
    name: vault
    namespace: vault
