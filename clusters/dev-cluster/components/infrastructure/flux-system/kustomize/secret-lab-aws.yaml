apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secret-lab-aws
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 30s
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/dev-cluster/components/infrastructure/secret-lab-aws
  prune: true
  wait: true
  dependsOn:
  - name: secret-stores
