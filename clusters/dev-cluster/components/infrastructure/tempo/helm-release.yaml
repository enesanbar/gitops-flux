apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: observability
spec:
  values:
    persistence:
      enabled: true
      size: 5Gi
      accessModes:
        - ReadWriteOnce
    # NOTE: the single-binary tempo chart reads the container resources from
    # `tempo.resources`, NOT a top-level `resources` key. A top-level block is
    # silently dropped, leaving the pod with no memory limit — which is how the
    # local-blocks metrics generator can balloon to multiple GB without ever
    # being OOMKilled. Keep this under `tempo:`.
    tempo:
      resources:
        limits:
          cpu: 500m
          memory: 1Gi
        requests:
          cpu: 100m
          memory: 256Mi
