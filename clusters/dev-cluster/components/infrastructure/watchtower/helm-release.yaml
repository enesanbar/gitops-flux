apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: watchtower
  namespace: watchtower
spec:
  values:
    serviceMonitor:
      enabled: true
    prometheusRule:
      enabled: true
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 500m, memory: 1Gi}
