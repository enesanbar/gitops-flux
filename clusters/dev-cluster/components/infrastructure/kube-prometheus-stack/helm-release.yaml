apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  values:
    alertmanager:
      ingress:
        enabled: true
        ingressClassName: nginx
        annotations:
          cert-manager.io/cluster-issuer: mkcert-issuer
        hosts:
          - alertmanager.kindcluster.dev
        tls:
          - secretName: alertmanager-tls
            hosts:
              - alertmanager.kindcluster.dev
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: standard
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 1Gi

    grafana:
      adminPassword: prom-operator
      ingress:
        enabled: true
        ingressClassName: nginx
        annotations:
          cert-manager.io/cluster-issuer: mkcert-issuer
        hosts:
          - grafana.kindcluster.dev
        tls:
          - secretName: grafana-tls
            hosts:
              - grafana.kindcluster.dev
      # The `grafana` PVC is declared in pv.yaml, pre-bound to a data-pool-2 hostPath PV.
      persistence:
        enabled: true
        type: pvc
        existingClaim: grafana
      # RWO PVC + RollingUpdate deadlocks: the new pod can't mount until the old one lets go.
      deploymentStrategy:
        type: Recreate
      # Grafana 13 ships Prometheus/Loki/Tempo/Jaeger as bundled plugins and, by
      # default, auto-updates them from grafana.com on every start. On this
      # read-only image the update unloads the running plugin, fails on the
      # unlink, and never reloads it: the datasources vanish after each restart
      # (grafana/grafana#132528). Plugin versions move with the image tag, not
      # at runtime. Same fix the grafana chart adopted in 13.2.3.
      grafana.ini:
        plugins:
          preinstall_auto_update: false
      # Dashboard ConfigMaps carry a `grafana_folder` annotation; the sidecar only
      # honours it with both of these set, otherwise everything lands in General.
      sidecar:
        dashboards:
          folderAnnotation: grafana_folder
          provider:
            foldersFromFilesStructure: true

    prometheus:
      ingress:
        enabled: true
        ingressClassName: nginx
        annotations:
          cert-manager.io/cluster-issuer: mkcert-issuer
        hosts:
          - prometheus.kindcluster.dev
        tls:
          - secretName: prometheus-tls
            hosts:
              - prometheus.kindcluster.dev
      prometheusSpec:
        # Prometheus is the OTLP/remote-write sink for the otel-collector.
        enableOTLPReceiver: true
        enableRemoteWriteReceiver: true
        retention: 30d
        retentionSize: 20GB
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: standard
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 25Gi
