apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  values:
    alertmanager:
      ingress:
        enabled: true
        ingressClassName: nginx
        annotations:
          cert-manager.io/cluster-issuer: mkcert-issuer
        hosts:
          - alertmanager.kindcluster.dev
        tls:
          - secretName: alertmanager-tls
            hosts:
              - alertmanager.kindcluster.dev
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: standard
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 1Gi

    grafana:
      adminPassword: prom-operator
      ingress:
        enabled: true
        ingressClassName: nginx
        annotations:
          cert-manager.io/cluster-issuer: mkcert-issuer
        hosts:
          - grafana.kindcluster.dev
        tls:
          - secretName: grafana-tls
            hosts:
              - grafana.kindcluster.dev
      # The `grafana` PVC is declared in pv.yaml, pre-bound to a data-pool-2 hostPath PV.
      persistence:
        enabled: true
        type: pvc
        existingClaim: grafana
      # RWO PVC + RollingUpdate deadlocks: the new pod can't mount until the old one lets go.
      deploymentStrategy:
        type: Recreate

    prometheus:
      ingress:
        enabled: true
        ingressClassName: nginx
        annotations:
          cert-manager.io/cluster-issuer: mkcert-issuer
        hosts:
          - prometheus.kindcluster.dev
        tls:
          - secretName: prometheus-tls
            hosts:
              - prometheus.kindcluster.dev
      prometheusSpec:
        # Prometheus is the OTLP/remote-write sink for the otel-collector.
        enableOTLPReceiver: true
        enableRemoteWriteReceiver: true
        retention: 30d
        retentionSize: 20GB
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: standard
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 25Gi
