apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ssm-app-secrets
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 30s
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/dev-cluster/components/apps/ssm-app-secrets
  prune: true
  wait: true
  # kstatus reads an ExternalSecret with no status yet as ready, and keeps reading a stale Ready after
  # its spec changes; syncedResourceVersion begins with the generation the operator last synced.
  # CreatedOnce, and Periodic with a zero interval, never sync again once synced, so for them Ready is
  # the signal: the generation check would fail for good after their first spec edit.
  healthCheckExprs:
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    current: >-
      has(status.conditions) && status.conditions.exists(e, e.type == 'Ready' && e.status == 'True') &&
      has(status.syncedResourceVersion) && (
      (has(spec.refreshPolicy) && spec.refreshPolicy == 'CreatedOnce') ||
      ((!has(spec.refreshPolicy) || spec.refreshPolicy == 'Periodic') &&
      has(spec.refreshInterval) && duration(spec.refreshInterval) == duration('0s')) ||
      status.syncedResourceVersion.startsWith(string(metadata.generation) + '-'))
  dependsOn:
  - name: aws-parameterstore
