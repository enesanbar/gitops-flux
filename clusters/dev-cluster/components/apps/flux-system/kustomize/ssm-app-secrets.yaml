apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ssm-app-secrets
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 30s
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/dev-cluster/components/apps/ssm-app-secrets
  prune: true
  wait: true
  # kstatus reads an ExternalSecret with no status yet as ready, and keeps reading a stale Ready after
  # its spec changes; syncedResourceVersion begins with the generation the operator last synced.
  healthCheckExprs:
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    current: >-
      has(status.conditions) && status.conditions.exists(e, e.type == 'Ready' && e.status == 'True') &&
      has(status.syncedResourceVersion) && status.syncedResourceVersion.startsWith(string(metadata.generation) + '-')
  dependsOn:
  - name: aws-parameterstore
