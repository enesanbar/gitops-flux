---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trellis-secrets
  namespace: flux-system
spec:
  # The trellis Kustomization owns the namespace but also the database; a missing namespace is a
  # retry here, not a reason to gate secret delivery on the database's health.
  dependsOn:
    - name: secret-stores
  interval: 10m0s
  retryInterval: 30s
  timeout: 15m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/dev-cluster/components/apps/trellis-secrets
  prune: true
  wait: true
  # kstatus reads a SecretStore or ExternalSecret with no status yet as ready, and keeps reading an
  # ExternalSecret's stale Ready after its spec changes; syncedResourceVersion begins with the
  # generation the operator last synced. CreatedOnce, and Periodic with an interval of zero or less,
  # never sync again once synced, so for them Ready is the signal: the generation check would fail
  # for good after their first spec edit.
  healthCheckExprs:
  - apiVersion: external-secrets.io/v1
    kind: SecretStore
    current: has(status.conditions) && status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    current: >-
      has(status.conditions) && status.conditions.exists(e, e.type == 'Ready' && e.status == 'True') &&
      has(status.syncedResourceVersion) && (
      (has(spec.refreshPolicy) && spec.refreshPolicy == 'CreatedOnce') ||
      ((!has(spec.refreshPolicy) || spec.refreshPolicy == 'Periodic') &&
      has(spec.refreshInterval) && duration(spec.refreshInterval) <= duration('0s')) ||
      status.syncedResourceVersion.startsWith(string(metadata.generation) + '-'))
