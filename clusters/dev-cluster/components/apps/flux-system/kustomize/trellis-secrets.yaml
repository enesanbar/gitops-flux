---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trellis-secrets
  namespace: flux-system
spec:
  # The trellis Kustomization owns the namespace but also the database; a missing namespace is a
  # retry here, not a reason to gate secret delivery on the database's health.
  dependsOn:
    - name: secret-stores
  interval: 10m0s
  retryInterval: 30s
  timeout: 15m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/dev-cluster/components/apps/trellis-secrets
  prune: true
  wait: true
